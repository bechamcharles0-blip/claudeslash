name: CI/CD Pipeline

on:
  push:
    branches:
      - main
      - staging
      - develop
    paths:
      - 'src/**'
      - 'package*.json'
      - 'tsconfig.json'
      - 'Dockerfile'
      - '.github/workflows/**'
  pull_request:
    branches:
      - main
      - staging
      - develop
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Stage 1: Lint and format check
  lint:
    runs-on: ubuntu-latest
    name: Lint and Format
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler check
        run: npx tsc --noEmit

      - name: Lint check (optional)
        run: |
          if [ -f .eslintrc.json ] || [ -f .eslintrc.js ]; then
            npx eslint src/
          fi
        continue-on-error: true

  # Stage 2: Run tests
  test:
    runs-on: ubuntu-latest
    name: Run Tests
    needs: lint
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test
        env:
          REDIS_URL: redis://localhost:6379

  # Stage 3: Build and push Docker image
  build:
    runs-on: ubuntu-latest
    name: Build Docker Image
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Stage 4: Deploy to staging
  deploy-staging:
    runs-on: ubuntu-latest
    name: Deploy to Staging
    needs: build
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to staging
        run: |
          echo "Deploying to staging environment..."
          # Add your staging deployment commands here
          # Example for Kubernetes:
          # kubectl set image deployment/claude-router-api claude-router=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:develop -n claude-router --kubeconfig=${{ secrets.KUBE_CONFIG }}

      - name: Health check
        run: |
          echo "Running health checks..."
          for i in {1..30}; do
            if curl -f http://staging-api.claude-router.local/api/health; then
              echo "Staging deployment healthy"
              exit 0
            fi
            echo "Waiting for staging deployment... ($i/30)"
            sleep 2
          done
          echo "Staging deployment health check failed"
          exit 1
        continue-on-error: true

  # Stage 5: Deploy to production
  deploy-production:
    runs-on: ubuntu-latest
    name: Deploy to Production
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    environment:
      name: production
      url: https://api.claude-router.io

    steps:
      - uses: actions/checkout@v4

      - name: Create deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.ref,
              environment: 'production',
              required_contexts: [],
              auto_merge: false
            });
            core.setOutput('deployment_id', deployment.data.id);

      - name: Deploy to production
        run: |
          echo "Deploying to production environment..."
          # Add your production deployment commands here
          # Example for Kubernetes:
          # kubectl set image deployment/claude-router-api claude-router=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main -n claude-router --kubeconfig=${{ secrets.KUBE_CONFIG }}

      - name: Health check
        run: |
          echo "Running health checks..."
          for i in {1..30}; do
            if curl -f https://api.claude-router.io/api/health; then
              echo "Production deployment healthy"
              exit 0
            fi
            echo "Waiting for production deployment... ($i/30)"
            sleep 2
          done
          echo "Production deployment health check failed"
          exit 1

      - name: Smoke tests
        run: |
          echo "Running smoke tests..."
          # Add your smoke tests here
          curl https://api.claude-router.io/api/models
          curl https://api.claude-router.io/api/stats

  # Stage 6: Notify
  notify:
    runs-on: ubuntu-latest
    name: Notify Deployment
    needs: [lint, test, build]
    if: always()

    steps:
      - name: Send Slack notification
        uses: 8398a7/action-slack@v3
        if: always()
        with:
          status: ${{ job.status }}
          webhook_url: ${{ secrets.SLACK_WEBHOOK }}
          fields: repo,message,commit,author,action,eventName,ref,workflow
        continue-on-error: true
