apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: claude-router-api-hpa
  namespace: claude-router
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: claude-router-api
  minReplicas: 3
  maxReplicas: 50
  metrics:
  # 1. CPU utilization: fast reaction to spikes (70% threshold)
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  # 2. Memory utilization: prevent OOM (80% threshold)
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  # 3. HTTP requests per second: custom metric from Prometheus
  # This scales based on RPS to handle traffic spikes
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: "1000"
  # 4. Request latency: P99 latency indicator (critical for SLO)
  # Scales up if latency exceeds 500ms average
  - type: Pods
    pods:
      metric:
        name: http_request_duration_seconds
        selector:
          matchLabels:
            quantile: "0.99"
      target:
        type: AverageValue
        averageValue: "0.5"
  # 5. Redis connection queue depth (indicates backend pressure)
  # Scales up if queue builds
  - type: Pods
    pods:
      metric:
        name: redis_queue_depth
      target:
        type: AverageValue
        averageValue: "100"
  behavior:
    # SCALE DOWN: Conservative (300s stabilization = preserve warm capacity)
    # Production insight: Hotstar/Dream11 scale down slowly to maintain burst capacity
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      # Remove max 50% of pods per minute (gradual scale-down)
      - type: Percent
        value: 50
        periodSeconds: 60
      # Or remove max 2 pods per 30s (absolute floor on speed)
      - type: Pods
        value: 2
        periodSeconds: 30
      selectPolicy: Min
    # SCALE UP: Aggressive (0s stabilization = immediate response)
    # Production insight: Hotstar scales up within 30s to handle 10x spikes
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      # Double pods every 15 seconds (100% increase)
      - type: Percent
        value: 100
        periodSeconds: 15
      # Or add 4 pods every 15 seconds
      - type: Pods
        value: 4
        periodSeconds: 15
      selectPolicy: Max
---
apiVersion: v1
kind: Service
metadata:
  name: claude-router-api
  namespace: claude-router
  labels:
    app: claude-router-api
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  selector:
    app: claude-router-api
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  - name: https
    port: 443
    targetPort: 3000
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: claude-router-internal
  namespace: claude-router
  labels:
    app: claude-router-api
spec:
  type: ClusterIP
  selector:
    app: claude-router-api
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    protocol: TCP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: claude-router-api-pdb
  namespace: claude-router
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: claude-router-api
