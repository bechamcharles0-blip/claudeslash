apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: claude-router-api-hpa
  namespace: claude-router
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: claude-router-api
  minReplicas: 3
  maxReplicas: 50
  metrics:
  # CPU-based scaling: 70% target
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  # Memory-based scaling: 80% target
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  # Custom metric: requests per second
  - type: Pods
    pods:
      metric:
        name: http_requests_per_second
      target:
        type: AverageValue
        averageValue: "1000"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 15
      - type: Pods
        value: 4
        periodSeconds: 15
      selectPolicy: Max
