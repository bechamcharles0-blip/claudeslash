# Create with: kubectl create secret generic claude-router-secrets --from-literal=ANTHROPIC_API_KEY=<key> -n claude-router
apiVersion: v1
kind: Secret
metadata:
  name: claude-router-secrets
  namespace: claude-router
type: Opaque
stringData:
  ANTHROPIC_API_KEY: "REPLACE_WITH_ACTUAL_KEY"
  REDIS_PASSWORD: "redis-password-change-in-production"
