groups:
  - name: claude-router
    interval: 30s
    rules:
      # High error rate
      - alert: HighErrorRate
        expr: |
          (sum(rate(http_requests_total{status=~"5.."}[5m])) by (job))
          /
          (sum(rate(http_requests_total[5m])) by (job)) > 0.05
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected for {{ $labels.job }}"
          description: "Error rate is {{ $value | humanizePercentage }}"

      # High latency
      - alert: HighLatency
        expr: |
          histogram_quantile(0.95, sum(rate(http_request_duration_seconds_bucket[5m])) by (le, job)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High latency detected for {{ $labels.job }}"
          description: "P95 latency is {{ $value | humanizeDuration }}"

      # High memory usage
      - alert: HighMemoryUsage
        expr: |
          (container_memory_usage_bytes / container_spec_memory_limit_bytes) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage in {{ $labels.pod_name }}"
          description: "Memory usage is {{ $value | humanizePercentage }}"

      # High CPU usage
      - alert: HighCPUUsage
        expr: |
          (rate(container_cpu_usage_seconds_total[5m])) > 0.9
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage in {{ $labels.pod_name }}"
          description: "CPU usage is {{ $value | humanizePercentage }}"

      # Pod restart rate
      - alert: PodRestartingTooOften
        expr: |
          rate(kube_pod_container_status_restarts_total[1h]) > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Pod {{ $labels.pod }} restarting frequently"
          description: "Pod has restarted {{ $value | humanize }} times in the last hour"

      # Redis down
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Redis is down"
          description: "Redis instance has been down for more than 1 minute"

      # API response time SLO breach
      - alert: SLOBreach
        expr: |
          histogram_quantile(0.99, sum(rate(http_request_duration_seconds_bucket[5m])) by (le)) > 3
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "API SLO breach detected"
          description: "P99 response time exceeded 3 seconds for 10 minutes"

      # Low cache hit rate
      - alert: LowCacheHitRate
        expr: |
          (sum(rate(cache_hits_total[5m])) by (job))
          /
          (sum(rate(cache_hits_total[5m]) + rate(cache_misses_total[5m])) by (job)) < 0.3
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low cache hit rate for {{ $labels.job }}"
          description: "Cache hit rate is {{ $value | humanizePercentage }}"
